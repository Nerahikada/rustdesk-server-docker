services:
  http:
    image: nginx:stable
    volumes:
      - ./http.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_var:/var/lib/letsencrypt
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/.well-known/acme-challenge/healthz | grep -q 404"]
      interval: 5s
      timeout: 3s
      retries: 12
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt_etc:/etc/letsencrypt
      - letsencrypt_var:/var/lib/letsencrypt
    command: >
      certonly --agree-tos --no-eff-email --non-interactive --webroot --webroot-path /var/lib/letsencrypt
      --email YOUR_EMAIL_ADDRESS_HERE
      -d RUSTDESK_SERVER_DOMAIN_HERE
    depends_on:
      http:
        condition: service_healthy
  certbot_renew:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt_etc:/etc/letsencrypt
      - letsencrypt_var:/var/lib/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    depends_on:
      certbot:
        condition: service_completed_successfully
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes:
      - ./rustdesk_data:/root
    network_mode: host
    restart: unless-stopped
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./rustdesk_data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped
  https:
    image: nginx:stable
    volumes:
      - ./nginx-reload.sh:/docker-entrypoint.d/40-nginx-reload.sh:ro
      - ./https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - ./ssl-dhparams.pem:/etc/nginx/ssl-dhparams.pem:ro
      - letsencrypt_etc:/etc/letsencrypt:ro
    network_mode: host
    restart: unless-stopped
    depends_on:
      certbot:
        condition: service_completed_successfully
volumes:
  letsencrypt_etc:
  letsencrypt_var:
