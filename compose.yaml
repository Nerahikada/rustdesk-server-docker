services:
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt_etc:/etc/letsencrypt
      - letsencrypt_var:/var/lib/letsencrypt
    command: >
      certonly --agree-tos --no-eff-email --non-interactive --standalone
      --email ${CERTBOT_EMAIL:?set CERTBOT_EMAIL in .env}
      -d ${RUSTDESK_DOMAIN:?set RUSTDESK_DOMAIN in .env}
    network_mode: host
  certbot_renew:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt_etc:/etc/letsencrypt
      - letsencrypt_var:/var/lib/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --standalone; sleep 12h & wait $${!}; done'
    network_mode: host
    restart: unless-stopped
    depends_on:
      certbot:
        condition: service_completed_successfully
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes:
      - ./rustdesk_data:/root
    network_mode: host
    restart: unless-stopped
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./rustdesk_data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped
  https:
    image: nginx:stable
    volumes:
      - ./nginx-reload.sh:/docker-entrypoint.d/40-nginx-reload.sh:ro
      - ./https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - ./ssl-dhparams.pem:/etc/nginx/ssl-dhparams.pem:ro
      - letsencrypt_etc:/etc/letsencrypt:ro
    environment:
      RUSTDESK_DOMAIN: ${RUSTDESK_DOMAIN:?set RUSTDESK_DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: "^RUSTDESK_"
    network_mode: host
    restart: unless-stopped
    depends_on:
      certbot:
        condition: service_completed_successfully
volumes:
  letsencrypt_etc:
  letsencrypt_var:
